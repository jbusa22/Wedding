<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script>document.documentElement.classList.add('js');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jack &amp; Liza — Save the Date</title>
  <meta name="description" content="Save the date for Jack and Liza's wedding in Berkeley, California." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Jack &amp; Liza — Save the Date" />
  <meta property="og:description" content="August 21, 2027 · Berkeley, California" />
  <meta property="og:image" content="/assets/save-the-date-social-redwoods.png" />
  <meta property="og:image:width" content="792" />
  <meta property="og:image:height" content="1304" />
  <meta property="og:image:alt" content="Jack and Liza's save the date among California redwoods: August 21, 2027, in Berkeley, California." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Jack &amp; Liza — Save the Date" />
  <meta name="twitter:description" content="August 21, 2027 · Berkeley, California" />
  <meta name="twitter:image" content="/assets/save-the-date-social-redwoods.png" />
  <meta name="theme-color" content="#213e32" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&amp;family=Italiana&amp;family=Manrope:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./save-date.css" />
</head>
<body>
  <main>
    <section class="save-hero" aria-labelledby="save-title">
      <div class="hero-reveal" aria-hidden="true">
        <div class="hero-reveal__mark">
          <span>Save the date</span>
          <strong>J <i>&amp;</i> L</strong>
          <b></b>
        </div>
      </div>
      <img class="save-hero__art" src="./assets/redwood-canopy-watercolor.png" alt="A watercolor view looking upward through a grove of towering California redwoods" fetchpriority="high" decoding="async" />
      <div class="save-hero__wash" aria-hidden="true"></div>
      <div class="save-hero__content">
        <p class="save-kicker">Save the date</p>
        <h1 id="save-title"><span>Jack</span><i class="name-ampersand">&amp;</i><span>Liza</span></h1>
        <time class="save-date" datetime="2027-08-21" aria-label="August 21, 2027"><span>August 21, 2027</span></time>
        <p class="save-location">Berkeley, California</p>
      </div>
      <a class="address-trigger" href="#mailing-address">Share your mailing address <span aria-hidden="true">↓</span></a>
    </section>

    <section class="address-section" id="mailing-address" aria-labelledby="address-title">
      <div class="address-intro">
        <h2 id="address-title">Invitations<br>to follow.</h2>
        <p>Where can we send yours?</p>
      </div>
      <div class="address-panel">
        <form class="mailing-form" data-address-form autocomplete="on">
          <label for="mailing-name">Your name or names<input id="mailing-name" name="name" type="text" autocomplete="name" autocapitalize="words" placeholder="Alex and Sam Smith" required /></label>
          <input type="text" name="website" tabindex="-1" autocomplete="off" aria-label="Leave this field empty" class="honey" aria-hidden="true" />
          <input type="hidden" name="loadedAt" data-loaded-at />
          <label for="mailing-street">Street address<input id="mailing-street" name="street" type="text" autocomplete="section-mailing shipping address-line1" autocapitalize="words" placeholder="123 Main St, Apt 4" required /></label>
          <div class="field-grid">
            <label for="mailing-city">City<input id="mailing-city" name="city" type="text" autocomplete="section-mailing shipping address-level2" autocapitalize="words" placeholder="Berkeley" required /></label>
            <label for="mailing-state">State<input id="mailing-state" name="state" type="text" autocomplete="section-mailing shipping address-level1" autocapitalize="characters" maxlength="2" placeholder="CA" required /></label>
            <label for="mailing-zip">ZIP code<input id="mailing-zip" name="zip" type="text" autocomplete="section-mailing shipping postal-code" inputmode="numeric" placeholder="94704" required /></label>
          </div>
          <button class="save-address" type="submit">Send address <span aria-hidden="true">→</span></button>
          <p class="form-status" data-address-status role="status"></p>
        </form>
        <div class="address-thanks" data-address-thanks tabindex="-1" hidden>
          <h3>Thank you!</h3>
          <p class="address-thanks__date"><time datetime="2027-08-21">August 21, 2027</time><span aria-hidden="true">·</span> Berkeley, California</p>
          <div class="address-thanks__actions">
            <a class="calendar-link" href="./assets/jack-liza-save-the-date.ics" download>Add to calendar <span aria-hidden="true">↓</span></a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="./save-date.js" defer></script>
</body>
</html>
